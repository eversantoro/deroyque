name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testes unitarios (surefire) + integracao com Testcontainers (failsafe; o runner ja tem Docker).
      - name: Build, testes e cobertura
        run: ./mvnw -B verify

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/site/jacoco-it

  docker:
    name: Imagem Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: deroyque-activation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
